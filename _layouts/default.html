<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - {{ site.title }}</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  <!-- Favicon (optional) -->
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
</head>
<body>

  <!-- Light/Dark Mode Toggle Button will be injected by JS -->

  <div class="container">
    <header>
      <h1 class="neon-pulse">{{ site.title }}</h1>
      <p class="contact-info">
        {{ site.email }} &bull; {{ site.phone }} &bull; {{ site.location }}
      </p>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p style="margin-top: 3rem; font-size: 0.9rem;">
        &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with ❤️ using GitHub Pages.
      </p>
    </footer>
  </div>

  <!-- JS for Theme Toggle -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'toggle-theme';
      toggleBtn.textContent = 'Toggle Light/Dark Mode';
      document.body.appendChild(toggleBtn);

      const savedMode = localStorage.getItem('themeMode');
      if (savedMode === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.add('dark-mode');
      }

      toggleBtn.addEventListener('click', () => {
        if (document.body.classList.contains('dark-mode')) {
          document.body.classList.remove('dark-mode');
          document.body.classList.add('light-mode');
          localStorage.setItem('themeMode', 'light');
        } else {
          document.body.classList.remove('light-mode');
          document.body.classList.add('dark-mode');
          localStorage.setItem('themeMode', 'dark');
        }
      });
    });
  </script>

</body>
</html>
